# For a service managed through a Render Blueprint.
# An existing dashboard-managed service must apply these settings manually.
services:
  - type: web
    name: storybook-app
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://writeestoriess.onrender.com/auth/google/callback
      - key: SESSION_SECRET
        generateValue: true
